syntax = "proto3";

package ripclone;

// Content-addressed reference to a chunk stored in the CAS.
message ChunkRef {
  // Raw hash bytes. SHA-256 (32 bytes) by default.
  bytes hash = 1;
  // Byte length of the chunk as stored, compressed.
  uint64 len = 2;
}

// Top-level manifest for a commit's clonepack.
//
// This is the only per-commit object the client fetches first. Everything else
// is content-addressed and referenced by hash, so it can be served from a CDN
// or object store via signed URLs.
message ClonepackManifest {
  string commit = 1;
  optional string parent_commit = 2;
  reserved 3, 6, 7, 8;

  // Metadata chunk holds the file and frame tables needed to decode archive
  // chunks. With `metadata_delta`, it is the base table the delta applies to.
  ChunkRef metadata_chunk = 4;

  // A MetadataDelta on `metadata_chunk`, when the table is stored as one.
  ChunkRef metadata_delta = 14;

  // Archive chunks contain working-tree zstd frames. They are shared across
  // commits and immutable.
  repeated ChunkRef archive_chunks = 5;

  // The editable clone payload: many small, self-contained git packs (each
  // ~1-2 MB with its own idx). The client downloads them in parallel and, as
  // each lands, installs it into `.git/objects/pack` and extracts the files it
  // contains — overlapping download and extraction. This list IS the index;
  // no separate per-pack table is needed.
  repeated PackEntry packs = 11;

  // Pre-built multi-pack-index over exactly the packs in `packs`, built
  // server-side using the client's deterministic `pack-<trailer>.{pack,idx}`
  // filenames. The client drops it into `.git/objects/pack/multi-pack-index`
  // so object lookups stay O(log) across many packs without spending CPU on a
  // client-side `git multi-pack-index write`. Incremental shallow manifests may
  // omit it when base packs are no longer local; the client builds that MIDX.
  ChunkRef midx = 12;

  // A Head's pack idx files concatenated into one content-addressed blob.
  // The idx for `packs[i]` lives at `[packs[i].idx_bundle_offset,
  // +packs[i].idx.len)`. The client fetches this ONCE and slices each idx out
  // locally, instead of a separate GET per small pack idx (a big win on
  // high-latency links). Each slice is still verified against
  // `packs[i].idx.hash`. A Full has none: its history packs hold every
  // object, so a full clone installs only them, fetching each idx by
  // `packs[i].idx` next to its pack, and reads the HEAD packs only for the
  // working tree.
  ChunkRef idx_bundle = 13;
}

// One self-contained git pack plus its index, addressed by content hash.
message PackEntry {
  ChunkRef pack = 1;
  ChunkRef idx = 2;
  // When true, this pack is history-only: deltified, installed for the object
  // database but NOT hand-parsed for the working tree (the client can't parse
  // deltas, and the worktree comes entirely from the undeltified HEAD-closure
  // packs). Default false = HEAD-closure pack, hand-parsed for the worktree
  // packs).
  bool history_only = 3;

  // Byte offset of this pack's idx within the manifest's `idx_bundle`, whose
  // length is `idx.len`. Unset when the idx is not in the bundle: a Head's
  // levels, and every Full pack. A client that keeps such a pack fetches its
  // idx on its own.
  optional uint64 idx_bundle_offset = 4;
}

// Per-commit metadata chunk. This is the only chunk that changes on every
// commit; archive chunks are shared and immutable. Stored zstd-compressed.
message MetadataChunk {
  // Fields 1 and 2 held a skeleton pack and idx (commit, trees, symlink
  // blobs). The packs already hold those objects. Field 3 held a prebuilt
  // .git/index; the client writes the index from the packs it installs.
  reserved 1, 2, 3;

  // Frame table. The index into this list is the frame index used by fragments.
  repeated FrameInfo frames = 4;

  // File table mapping paths to blobs and fragments.
  repeated FileEntry files = 5;

  // Paths of submodule gitlinks (mode 160000). A clone creates each as an
  // empty directory, as `git clone` does for a submodule it does not init.
  repeated bytes gitlinks = 6;
}

// A metadata chunk as the changes from a base chunk, so a build whose table
// is close to its base's stores only what changed. The table is the base's
// entries, less `removed`, with `files` in place of the base's entries of
// the same paths and after them, and with `frames` and `gitlinks`.
message MetadataDelta {
  // The table's frames, all of them.
  repeated FrameInfo frames = 1;
  // For each frame of the base, its index in `frames` plus one, or 0 when
  // the table drops it. A base entry the delta keeps names its frames
  // through this map.
  repeated uint32 base_frames = 2;
  // Entries the base lacks or holds otherwise.
  repeated FileEntry files = 3;
  // Paths of the base the table lacks.
  repeated bytes removed = 4;
  // The table's gitlinks, all of them.
  repeated bytes gitlinks = 5;
}

// One zstd frame inside an archive chunk.
message FrameInfo {
  // Index into ClonepackManifest.archive_chunks.
  uint32 chunk_index = 1;
  // Byte offset within that chunk.
  uint64 chunk_offset = 2;
  // Compressed length of the frame.
  uint32 compressed_len = 3;
  // Uncompressed length of the frame.
  uint32 raw_len = 4;
}

// One file in the working tree.
message FileEntry {
  // Repository-relative path, stored as raw bytes to preserve arbitrary git
  // path encodings.
  bytes path = 1;
  // Git mode, e.g. 0o100644 or 0o120000.
  uint32 mode = 2;
  // The blob's 20-byte git object id.
  bytes blob_sha1 = 3;
  // Fragments making up this file, in order.
  repeated Fragment fragments = 4;
}

// One contiguous slice of a file inside a decompressed frame.
message Fragment {
  // Index into MetadataChunk.frames.
  uint32 frame_index = 1;
  // Byte offset inside the decompressed frame.
  uint32 frame_offset = 2;
  // Uncompressed length of the slice.
  uint32 raw_len = 3;
}

// A repository's tags: every upstream tag whose target the server's mirror
// holds, as the mirror's `refs/tags/` lists them. One per tag state,
// addressed by content hash and stored zstd-compressed. A clone keeps the
// tags whose peeled target is among its objects, as `git clone` gets them.
message TagsArtifact {
  // Sorted by name.
  repeated Tag tags = 1;
  // The raw content of every annotated tag object the tags name, each tag
  // of a tag included, sorted by object id.
  repeated bytes objects = 2;
}

// One tag: its name under `refs/tags/`, the object the ref names, and that
// object fully peeled. `peeled` is empty for a lightweight tag, whose
// object is its target.
message Tag {
  string name = 1;
  string object = 2;
  string peeled = 3;
}

// A repository's branches, for full clones: every upstream branch as a
// refresh left the mirror's `refs/heads/`, and the default branch. Beside
// it the server stores one pack of every object reachable from a branch or
// tag but not from `base`, so a full clone holding `base` gets every ref
// complete.
message BranchesArtifact {
  // Empty when upstream named none.
  string default_branch = 1;
  // The default branch's commit, whose history the side pack leaves out.
  // Empty when there is no default branch, and then there is no side pack.
  string base = 2;
  // Sorted by name.
  repeated Branch branches = 3;
}

// One branch: its name under `refs/heads/` and its commit.
message Branch {
  string name = 1;
  string commit = 2;
}
