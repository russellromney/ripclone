name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RIPCLONE_ORIGIN_BASE_DEFAULT: ""
  # Incremental artifacts bloat target/ and don't help cold CI runners (see
  # rust-ci-performance). rust-cache restores a full target tree instead.
  CARGO_INCREMENTAL: "0"

# Caching: sccache for rustc objects (shared across jobs) + Swatinem/rust-cache
# for registry/git (keyed by Cargo.lock). Fan-out jobs that only run prebuilt
# binaries skip both.
jobs:
  # Detect whether anything that affects Docker / musl smoke changed, so docs-
  # or CI-only PRs skip the slow image build / static-musl cross-compile.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      bench: ${{ steps.filter.outputs.bench }}
      musl: ${{ steps.filter.outputs.musl }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'rust/**'
              - 'tests/fly/Dockerfile*'
              - 'scripts/fly_client_test.sh'
              - 'scripts/e2e_full_topup_minio.sh'
              - 'scripts/e2e_full_topup_gitea.sh'
              - '.github/workflows/ci.yml'
            bench:
              - 'rust/**'
              - 'benchmark/**'
              - 'scripts/benchmark_smoke.sh'
              - 'scripts/ci.sh'
              - '.github/workflows/ci.yml'
            # musl is a separate target_env (mimalloc global allocator, hand-
            # written statx, fully-static link). Skip pure-test / docs PRs; still
            # always run on main so main never drifts silently.
            musl:
              - 'rust/src/**'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - 'rust/build.rs'
              - 'rust/.cargo/**'
              - 'scripts/musl-smoke.sh'
              - 'scripts/install-build-deps.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  lint:
    runs-on: ubuntu-latest
    env:
      # sccache shares rustc objects across jobs via GHA cache API v2 (older
      # attempts used a retired v1 API; mozilla-actions/sccache-action + modern
      # sccache talk to the current service).
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      # Reads the pinned channel + components from rust-toolchain.toml; caches the
      # cargo registry + target/ (keyed by Cargo.lock). cache-workspaces -> rust/.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: rust
      - name: Install build deps
        run: bash scripts/install-build-deps.sh
      - name: Lint (fmt + clippy)
        run: bash scripts/ci.sh lint
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # One compile (ci profile + mold + sccache) for fan-out jobs that only need
  # runnable bins or a handful of integration tests. Those jobs DOWNLOAD these
  # and never invoke cargo. The unit/integration `test` job self-compiles —
  # Keep this artifact set limited to the binaries consumed by fan-out jobs.
  ci-build:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: rust
      - name: Install build deps
        run: bash scripts/install-build-deps.sh
      - name: Build bins + fan-out test binaries (ci profile)
        run: bash scripts/ci.sh ci-build
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
      - name: Upload ci artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts
          path: rust/target/ci-artifacts/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  # Unit + integration tests (ci profile). Self-compiles in parallel with
  # ci-build so wall clock is max(ci-build, test), not sum.
  test:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: rust
      - name: Install build deps
        run: bash scripts/install-build-deps.sh
      - name: Tests (ci profile)
        run: bash scripts/ci.sh test
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  e2e:
    needs: ci-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download ci artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-artifacts
          path: bin
      - name: End-to-end (local origin, prebuilt binaries)
        env:
          CI_ARTIFACTS: ${{ github.workspace }}/bin
        run: |
          set -euo pipefail
          chmod +x bin/*
          bash scripts/ci.sh e2e

  # Discover the individual #[ignore = "requires S3 credentials"] test names in
  # e2e_remote_gc_s3.rs so the s3gc job below can shard one-test-per-runner.
  s3gc-tests:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - name: List ignored S3 test names
        id: list
        run: |
          set -euo pipefail
          names=$(grep -A2 '#\[ignore = "requires S3 credentials"\]' rust/tests/e2e_remote_gc_s3.rs \
            | grep -oP 'async fn \K[a-zA-Z0-9_]+(?=\()')
          json=$(printf '%s\n' "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "found: $json"
          test "$(echo "$json" | jq 'length')" -ge 1
          echo "tests=$json" >> "$GITHUB_OUTPUT"

  # S3-backed remote GC e2e — prebuilt binary from ci-build, one test per shard.
  s3gc:
    needs: [changes, s3gc-tests, ci-build]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.s3gc-tests.outputs.tests) }}
    services:
      minio:
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
      - name: Download ci artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-artifacts
          path: bin
      - name: Wait for MinIO and create per-shard bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          STRATEGY_JOB_INDEX: ${{ strategy.job-index }}
        run: |
          set -euo pipefail
          SHARD_BUCKET="ripclone-${GITHUB_RUN_ID}-${STRATEGY_JOB_INDEX:-0}"
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null
          aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb "s3://${SHARD_BUCKET}"
          echo "RIPCLONE_S3_BUCKET=${SHARD_BUCKET}" >> "$GITHUB_ENV"
      - name: S3 GC e2e against MinIO (${{ matrix.test }})
        timeout-minutes: 6
        env:
          S3GC_TEST_BIN: ${{ github.workspace }}/bin/e2e_remote_gc_s3
          CARGO_BIN_EXE_ripclone: ${{ github.workspace }}/bin/ripclone
        run: |
          set -euo pipefail
          chmod +x "$S3GC_TEST_BIN" "$CARGO_BIN_EXE_ripclone"
          bash scripts/ci.sh s3gc "${{ matrix.test }}"

  # Product composition surrogate: the server uses an embedded replica against
  # the official libsql server fixture, the standalone worker is API-only, and
  # artifact bytes use digest-pinned MinIO. Real Turso is recorded separately.
  turso-api-worker-minio:
    needs: [changes, ci-build]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      sqld:
        image: ghcr.io/tursodatabase/libsql-server@sha256:bc100873a74865392a49191b4733025fe8222a409799efa424dc196feaf05035
        ports:
          - 8080:8080
      minio:
        image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
        command: server /data
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
      - name: Download ci artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-artifacts
          path: bin
      - name: Wait for primary and MinIO, then create bucket
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8080/health >/dev/null
          for _ in $(seq 1 60); do
            curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 s3 mb "s3://ripclone-${GITHUB_RUN_ID}-turso-worker"
      - name: Turso-replica API worker with S3 artifacts (official local surrogate)
        timeout-minutes: 6
        env:
          RIPCLONE_REQUIRE_TURSO: "1"
          RIPCLONE_TURSO_DATABASE_URL: http://127.0.0.1:8080
          RIPCLONE_TURSO_AUTH_TOKEN: local-surrogate
          RIPCLONE_S3_ENDPOINT: http://127.0.0.1:9000
          RIPCLONE_S3_REGION: us-east-1
          RIPCLONE_S3_BUCKET: ripclone-${{ github.run_id }}-turso-worker
          RIPCLONE_S3_PREFIX: control-collapse/turso-api-worker/
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          CARGO_BIN_EXE_ripclone: ${{ github.workspace }}/bin/ripclone
          CARGO_BIN_EXE_ripclone-worker: ${{ github.workspace }}/bin/ripclone-worker
        run: |
          set -euo pipefail
          test_bin="${{ github.workspace }}/bin/e2e_token_only_worker"
          chmod +x "$test_bin" "$CARGO_BIN_EXE_ripclone" "$CARGO_BIN_EXE_ripclone-worker"
          test_name=token_only_worker_builds_and_clones_without_control_credentials
          timeout 30 "$test_bin" --list | grep -Fqx "$test_name: test"
          timeout 300 "$test_bin" --exact "$test_name"

  # Real signed base-A artifact download and stale pinned-B refresh against
  # digest-pinned MinIO. Runs the one focused ignored fixture test exactly.
  full-topup-minio:
    needs: [changes, ci-build]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Download ci artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-artifacts
          path: bin
      - name: Digest-pinned MinIO Full top-up e2e
        env:
          CI_ARTIFACTS: ${{ github.workspace }}/bin
          RIPCLONE_BIN_DIR: ${{ github.workspace }}/bin
        run: |
          set -euo pipefail
          chmod +x bin/* scripts/e2e_full_topup_minio.sh
          bash scripts/e2e_full_topup_minio.sh

  # Real multi-provider + server-side-token path against a live Gitea.
  # Prebuilt e2e_gitea_provider from ci-build — no cargo on this runner.
  gitea:
    needs: [changes, ci-build]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download ci artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-artifacts
          path: bin
      - name: Digest-pinned Gitea provider + Full top-up e2e
        env:
          CI_ARTIFACTS: ${{ github.workspace }}/bin
          RIPCLONE_BIN_DIR: ${{ github.workspace }}/bin
          RIPCLONE_REQUIRE_GITEA: "1"
        run: |
          set -euo pipefail
          chmod +x bin/*
          bash scripts/e2e_full_topup_gitea.sh

  # Benchmark-harness smoke — prebuilt bins from ci-build.
  benchmark:
    needs: [changes, ci-build]
    if: ${{ needs.changes.outputs.bench == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download ci artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-artifacts
          path: bin
      - name: Benchmark-harness smoke test (local origin, prebuilt server)
        env:
          CI_ARTIFACTS: ${{ github.workspace }}/bin
        run: |
          set -euo pipefail
          chmod +x bin/*
          bash scripts/ci.sh benchmark

  # Image assembly smoke from prebuilt bins — no cargo on this runner.
  docker:
    needs: [changes, ci-build]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download ci artifacts
        uses: actions/download-artifact@v8
        with:
          name: ci-artifacts
          path: ci-bins
      - name: Stage binaries for Dockerfiles
        run: chmod +x ci-bins/*
      - name: Assemble runtime images from the compiled binaries
        run: |
          docker build -f tests/fly/Dockerfile.ci -t ripclone-server:ci .
          docker build -f tests/fly/Dockerfile.client.ci -t ripclone-client:ci .
      - name: Smoke-test the binaries run in the image
        run: |
          docker run --rm ripclone-server:ci ripclone-server --help
          docker run --rm ripclone-server:ci ripclone-worker --help

  # The static-musl release target. ONLY job that compiles under
  # `target_env = "musl"` (mimalloc global allocator + hand-written statx).
  # Path-gated on PRs; always runs on main so release-shape never drifts silent.
  musl:
    needs: changes
    if: ${{ github.ref == 'refs/heads/main' || needs.changes.outputs.musl == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: rust
          target: x86_64-unknown-linux-musl
      - name: Install build deps
        run: bash scripts/install-build-deps.sh
      # Zig is ~100MB; cache the venv so we do not re-download every run.
      - name: Cache cargo-zigbuild + zig
        uses: actions/cache@v4
        with:
          path: ~/.zigbuild
          key: zigbuild-0.15.2-${{ runner.os }}
      - name: Install cargo-zigbuild + zig (musl C cross-toolchain)
        # cargo-zigbuild locates zig via the `python-zig` app that the `ziglang`
        # wheel installs. `pipx inject` does NOT put that app on PATH (even with
        # --include-apps), so cargo-zigbuild fails with "cannot find binary
        # path". A plain venv on PATH exposes both cargo-zigbuild and python-zig.
        run: |
          if [ ! -x "$HOME/.zigbuild/bin/cargo-zigbuild" ]; then
            python3 -m venv "$HOME/.zigbuild"
            "$HOME/.zigbuild/bin/pip" install --quiet cargo-zigbuild "ziglang==0.15.2"
          fi
          echo "$HOME/.zigbuild/bin" >> "$GITHUB_PATH"
          # Pre-pull Alpine while the rustc graph builds (next step).
          docker pull --quiet alpine:latest &
      - name: Build + run the static musl binaries on Alpine
        run: bash scripts/musl-smoke.sh
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
